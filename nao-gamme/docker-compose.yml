services:
    postgres:
        image: postgres:16-alpine
        container_name: nao_gamme_postgres
        env_file:
            - .env
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-nao}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nao}
            POSTGRES_DB: ${POSTGRES_DB:-nao}
        volumes:
            - nao_gamme_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nao} -d ${POSTGRES_DB:-nao}']
            interval: 5s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    nao:
        image: getnao/nao:latest
        container_name: nao_gamme
        entrypoint:
            - /bin/sh
            - -c
            - /app/patches/patch-oauth.sh && exec /entrypoint.sh
        # Résolution locale du domaine → Caddy de l'hôte (bypass Cloudflare pour
        # le client MCP du backend ; les requêtes navigateur passent par CF normalement)
        extra_hosts:
            - 'lololo.hypeer.cloud:host-gateway'
        ports:
            - '127.0.0.1:${SERVER_PORT:-5005}:${SERVER_PORT:-5005}'
        environment:
            SERVER_PORT: ${SERVER_PORT:-5005}
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
            BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5005/}
            # Audience OAuth supplémentaire : le moteur gamme-engine (patch validAudiences).
            # Attention : correspondance EXACTE avec le resource du PRM (trailing slash inclus).
            # URL publique (via Caddy) pour que le flux OAuth navigateur fonctionne.
            GAMME_ENGINE_MCP_URL: https://lololo.hypeer.cloud/mcp
            # Clés des fournisseurs LLM (relues depuis la config du projet via {{ env(...) }})
            OPENCODE_BASE_URL: ${OPENCODE_BASE_URL}
            OPENCODE_API_KEY: ${OPENCODE_API_KEY}
            # Provider OpenCode Zen (pay-as-you-go) — modèle par défaut des conversations
            OPENCODE_ZEN_BASE_URL: ${OPENCODE_ZEN_BASE_URL}
            OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY}
            # Provider SeekAI (nouveau provider par défaut) — modèle deepseek-v4-flash-0731
            SEEKAI_BASE_URL: ${SEEKAI_BASE_URL}
            SEEKAI_API_KEY: ${SEEKAI_API_KEY}
            # Provider B.AI (provider par défaut) — modèle glm-5.3-flash
            B_AI_BASE_URL: ${B_AI_BASE_URL}
            B_AI_API_KEY: ${B_AI_API_KEY}
            GEMINI_API_KEY: ${GEMINI_API_KEY}
            # Bot Telegram (webhook) — config en base de données (project.telegram_settings)
            TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
            # Base de données de l'historique des conversations
            DB_URI: postgres://${POSTGRES_USER:-nao}:${POSTGRES_PASSWORD:-nao}@postgres:5432/${POSTGRES_DB:-nao}
            # Inscription libre (désactivée après création des comptes)
            ENABLE_USER_SIGNUP: ${ENABLE_USER_SIGNUP:-false}
            # Bêta : recommandations de contexte IA (audit périodique du contexte)
            BETA_CONTEXT_RECOMMENDATIONS_ENABLED: ${BETA_CONTEXT_RECOMMENDATIONS_ENABLED:-false}
            # Projet nao (config + fichiers) monté dans le conteneur
            NAO_CONTEXT_SOURCE: local
            NAO_DEFAULT_PROJECT_PATH: /app/project
        volumes:
            - .:/app/project
            - ./storage:/app/storage
            - ./nao-patches:/app/patches:ro
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped

    caddy:
        image: caddy:2-alpine
        container_name: nao_gamme_caddy
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - ./docs/rapports:/rapports:ro
            - ./docs/etiquettes:/etiquettes:ro
            - ./docs/images:/images:ro
            - caddy_config:/config
            - caddy_data:/data
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        depends_on:
            - nao
        restart: unless-stopped

    gamme-engine:
        build: ../gamme-engine
        container_name: gamme_engine
        extra_hosts:
            - 'lololo.hypeer.cloud:host-gateway'
        ports:
            - '127.0.0.1:8010:8010'
        environment:
            OPENCODE_BASE_URL: ${B_AI_BASE_URL}
            OPENCODE_API_KEY: ${B_AI_API_KEY}
            NAO_AUTH_ISSUER: ${BETTER_AUTH_URL}
            # Resource server URL publique (PRM + audience des JWT) — via Caddy
            GAMME_MCP_URL: https://lololo.hypeer.cloud/mcp
            GAMME_LLM_MODEL: ${GAMME_LLM_MODEL:-hy3-free}
            GAMME_MAX_LLM_ARTICLES: ${GAMME_MAX_LLM_ARTICLES:-40}
            GAMME_DATA_DIR: /storage/gamme
            NAO_PROJECT_DIR: /app/nao-project
            # Alertes Telegram (échecs d'import) — même token que le bot nao
            TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
        volumes:
            - /storage/gamme:/storage/gamme
            - .:/app/nao-project
            - ./storage:/storage/gamme/uploads
        restart: unless-stopped

    # Preview temporaire : dashboard open-source avec données mock du 17/08
    # (choix UI/UX en cours — ne pas utiliser en production)
    dashboard-preview:
        build: ../dashboard-preview
        container_name: dashboard_preview
        ports:
            - '127.0.0.1:3001:3000'
        restart: unless-stopped

volumes:
    nao_gamme_postgres_data:
    caddy_config:
    caddy_data:
